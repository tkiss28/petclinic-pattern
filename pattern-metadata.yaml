# This goal of this metadata is mainly used as a source of truth for
# documentation and qe
metadata_version: "1.0"
name: petclinic-pattern
description: A single-cluster Spring Petclinic learning lab with an ephemeral H2 database
pattern_version: "1.0"
display_name: Petclinic Pattern
repo_url: https://github.com/tkiss28/petclinic-pattern
docs_repo_url: https://github.com/tkiss28/petclinic-pattern
issues_url: https://github.com/tkiss28/petclinic-pattern/issues
docs_url: https://github.com/tkiss28/petclinic-pattern#readme
# No CI workflow is configured yet; do not claim the Multicloud GitOps CI results.
ci_url: https://github.com/tkiss28/petclinic-pattern/actions
# can be sandbox, tested or maintained
tier: sandbox
owners: tkiss28
# Inherited reference sizing, not tested minimums for this lab.
requirements:
  hub: # Main cluster
    compute:
      platform:
        gcp:
          replicas: 3
          type: n1-standard-8
        azure:
          replicas: 3
          type: Standard_D8s_v4
        aws:
          replicas: 3
          type: m5.2xlarge
    controlPlane:
      platform:
        gcp:
          replicas: 3
          type: n1-standard-4
        azure:
          replicas: 3
          type: Standard_D4s_v4
        aws:
          replicas: 3
          type: m5.xlarge
  spoke: # optional - represents the clusters imported into ACM
    compute:
      platform:
        gcp:
          replicas: 0
          type: n1-standard-8
        azure:
          replicas: 0
          type: Standard_D8s_v3
        aws:
          replicas: 0
          type: m5.2xlarge
    controlPlane:
      platform:
        gcp:
          replicas: 3
          type: n1-standard-8
        azure:
          replicas: 3
          type: Standard_D8s_v3
        aws:
          replicas: 3
          type: m5.2xlarge

# Loosely defined extra features like hypershift support, non-openshift
# kubernetes support, spoke support
extra_features:
  hypershift_support: false
  spoke_support: false

external_requirements:
  cluster_sizing_note: >-
    Cluster sizing has not been validated for this sandbox. The inherited sizing
    above is reference material only. This pattern deploys to one existing cluster;
    no spoke is used. Allow capacity for OpenShift GitOps and the Petclinic pod.
variants:
  - name: prod
    default: true
    description: Single-cluster Petclinic with H2, without ACM or Vault
